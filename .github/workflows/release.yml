# Najm release pipeline blueprint (Phase 5).
# Changesets drives versioning; publish carries npm provenance so every
# tarball is cryptographically tied to this repo + CI run.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # changesets opens the "Version Packages" PR
  id-token: write # npm --provenance attestation
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Gate: nothing publishes unless the whole surface is green.
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:packages

      - name: Version or publish
        uses: changesets/action@v1
        with:
          # Beta line publishes under the `beta` dist-tag; `latest` stays
          # on the last stable until Beta graduates.
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
